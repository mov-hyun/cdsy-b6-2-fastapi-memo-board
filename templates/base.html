<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}메모 게시판{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-icon" aria-hidden="true"></span>메모 게시판
            </a>
            <nav aria-label="주 메뉴">
                <a class="nav-link" href="{{ url_for('memo_list') }}"{% if request.url.path == '/memos' %} aria-current="page"{% endif %}>메모 목록</a>
                <a class="button button-primary nav-write" href="{{ url_for('memo_new') }}"{% if request.url.path == '/memos/new' %} aria-current="page"{% endif %}><span aria-hidden="true">＋</span> 새 메모</a>
            </nav>
        </div>
    </header>
    <main id="main" class="container">
        {% block main %}{% endblock %}
    </main>
</body>
</html>
